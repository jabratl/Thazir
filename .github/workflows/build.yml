name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      revert_to:
        description: 'REVERT (leave empty for a normal build). Type: previous | latest | a release tag like v0.0.331-b335 | a commit id'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: mgb-build2
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags, needed to revert to an older release
      - name: Revert source to an older release (only when revert_to is filled)
        if: ${{ github.event.inputs.revert_to != '' }}
        env:
          REVERT_TO: ${{ github.event.inputs.revert_to }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          # release tags newest build first, e.g. "335 v0.0.332-b335"
          TAGS=$(git tag -l 'v*-b*' | sed -E 's/^.*-b([0-9]+)$/\1 &/' | sort -rn | cut -d' ' -f2)
          T="$(echo "$REVERT_TO" | tr -d '[:space:]')"
          case "$T" in
            latest)   T=$(echo "$TAGS" | sed -n 1p) ;;   # source of the newest built release (drops a zip that failed to build)
            previous) T=$(echo "$TAGS" | sed -n 2p) ;;   # source of the release before the newest one
          esac
          if [ -z "$T" ] || ! git rev-parse -q --verify "${T}^{commit}" >/dev/null; then
            echo "::error::'$REVERT_TO' not found. Releases you can revert to:"
            echo "$TAGS" | head -20
            exit 1
          fi
          SHA=$(git rev-parse "${T}^{commit}")
          echo "Reverting source to $T ($SHA)"
          rm -rf _old; mkdir _old
          git archive "$SHA" | tar -x -C _old
          rm -rf _old/.github                      # keep the CURRENT workflow, never an old one
          git ls-files -z | grep -zv '^\.github/' | xargs -0 -r rm -f --
          cp -a _old/. .
          rm -rf _old
          git config user.name "mgb-bot"
          git config user.email "mgb-bot@users.noreply.github.com"
          git add -A
          git commit -m "Revert source to $T (${SHA:0:7})" || echo "source already identical, nothing to commit"
          git push
          echo "MGB_REVERTED_FROM=$T" >> "$GITHUB_ENV"
      - name: Apply uploaded zip(s)
        if: ${{ github.event.inputs.revert_to == '' }}
        run: |
          shopt -s nullglob
          LIST=$(for Z in *.zip; do echo "$(echo "$Z" | grep -oP '_v\K[0-9_]+(?=\.zip)' || echo 0) $Z"; done | sort -V | cut -d' ' -f2-)
          if [ -n "$LIST" ]; then
            while IFS= read -r Z; do
              echo "Applying $Z"
              rm -rf _tmp; mkdir _tmp
              unzip -oq "$Z" -d _tmp
              SRC=_tmp
              if [ "$(ls -A _tmp | wc -l)" = "1" ] && [ -d "_tmp/$(ls -A _tmp)" ]; then SRC="_tmp/$(ls -A _tmp)"; fi
              rm -rf "$SRC/.github"
              if [ -f "$SRC/DELETE.txt" ]; then
                while IFS= read -r P; do
                  P="${P%$'\r'}"
                  case "$P" in ""|\#*|/*|*..*|.git*) continue;; esac
                  rm -rf -- "./$P"
                done < "$SRC/DELETE.txt"
                rm -f "$SRC/DELETE.txt"
              fi
              cp -a "$SRC"/. .
              rm -f "$Z"
            done <<< "$LIST"
            rm -rf _tmp
            git config user.name "mgb-bot"
            git config user.email "mgb-bot@users.noreply.github.com"
            git add -A
            git commit -m "Apply uploaded zip" || echo "nothing to commit"
            git push
          else
            echo "No zip to apply"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Native fingerprint (S16, for ext-only hot updates)
        run: |
          H=$( { find app -type f ! -path 'app/build/*' ! -path 'app/src/main/assets/ext/*' ! -path 'app/build.gradle.kts' | LC_ALL=C sort | xargs -r -d '\n' sha256sum; grep -v 'appVersionName = ' app/build.gradle.kts | sha256sum; for F in settings.gradle.kts settings.gradle build.gradle.kts build.gradle gradle.properties; do if [ -f "$F" ]; then sha256sum "$F"; fi; done; } | sha256sum | cut -c1-16 )
          echo "Native hash: $H"
          echo "MGB_NATIVE_HASH=$H" >> "$GITHUB_ENV"
      - name: Prepare signing (only if secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/mgb.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/mgb.jks" >> "$GITHUB_ENV"
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
          else
            echo "No keystore secret: building DEBUG apk"
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
          fi
      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle "$TASK" --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MGB-apk
          path: app/build/outputs/apk/**/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -oP 'appVersionName = "\K[^"]+' app/build.gradle.kts)
          TAG="v${VER}-b${GITHUB_RUN_NUMBER}"
          APK=$(ls app/build/outputs/apk/*/*.apk | head -n1)
          cp "$APK" "MGB-${TAG}.apk"
          EXT=""
          if [ -d app/src/main/assets/ext ]; then
            EXT="MGB-ext-b${GITHUB_RUN_NUMBER}-n${MGB_NATIVE_HASH}.zip"
            rm -rf extpkg; mkdir extpkg
            cp -a app/src/main/assets/ext/. extpkg/
            printf '{"build":%s,"native":"%s"}' "$GITHUB_RUN_NUMBER" "$MGB_NATIVE_HASH" > extpkg/_bundle.json
            (cd extpkg && zip -qr "../$EXT" .)
          fi
          awk 'NR==1{next} /^[[:space:]]*$/{exit} {print}' CHANGELOG.txt > notes.txt || true
          [ -s notes.txt ] || echo "Build ${GITHUB_RUN_NUMBER}" > notes.txt
          TITLE="MGB ${VER} (build ${GITHUB_RUN_NUMBER})"
          if [ -n "${MGB_REVERTED_FROM:-}" ]; then
            # same code as the old release, but a NEW higher build number so Android / the in-app updater accept it as an update
            { echo "REVERT: this build has the source of ${MGB_REVERTED_FROM}"; cat notes.txt; } > notes2.txt && mv notes2.txt notes.txt
            TITLE="${TITLE} - revert to ${MGB_REVERTED_FROM}"
          fi
          gh release create "$TAG" "MGB-${TAG}.apk" $EXT \
            --title "$TITLE" \
            --notes-file notes.txt \
            --target "$(git rev-parse HEAD)"
